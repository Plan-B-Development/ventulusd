[package]
name = "ventulusd"
version = "5.6.0"
edition = "2021"
license = "MIT"
description = "Hardware fan control daemon for Linux (OpenFan, hwmon, AMD GPU)"
repository = "https://github.com/Plan-B-Development/ventulusd"
authors = ["Plan-B-Development <Mitchell.R.Palmer@gmail.com>"]

[dependencies]
axum = "0.8"
env_logger = "0.11"
# The IPC server's own accept loop (DEC-504): axum's `serve` cannot cap
# connections or set a header/idle timeout, so the daemon serves each Unix
# connection through hyper directly. Both were already in the tree via axum.
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-graceful"] }
# Reads an upload's body within a size and time bound (DEC-504); already in the
# tree via axum.
http-body-util = "0.1"
libc = "0.2"
# Runtime dynamic loading of libnvidia-ml.so.1 for opt-in, read-only NVIDIA
# telemetry (DEC-204). ISC-licensed — see deny.toml. Never a build/link-time
# dependency on any NVIDIA library; the daemon degrades cleanly when NVML is
# absent (the default: [detection] enable_nvidia_telemetry = false).
libloading = "0.9"
log = "0.4"
# Raw USB to an RP2040 in its bootloader, to write OpenFan firmware (DEC-483).
# Pure Rust over usbfs — no libusb, no netlink. Opening a device needs the
# opt-in `openfan-firmware-write` drop-in (DeviceAllow=char-usb_device).
nusb = "0.2.7"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4.9.0"
# Fingerprints a staged firmware file against the published releases (DEC-483).
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "io-util", "sync", "time"] }
toml = "0.8"
# `ServiceExt::oneshot`, to hand each request to the router (already in the tree
# via axum, with the same feature).
tower = { version = "0.5", default-features = false, features = ["util"] }

[dev-dependencies]
bytes = "1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "test-util"] }
